[package]
name = "nova-ui-calendar"
version = "0.1.0"
edition = "2024"
license.workspace = true
links = "novauicalendar"

[dependencies]
slint = { workspace = true }
i-slint-core = { workspace = true, features = ["image-decoders", "svg"] }
nova-ui-shared = { path = "../ui-shared" }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
