[package]
name = "nova-list-services"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Bounded Simkl and MDBList account, library and playback APIs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
url = "2"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
