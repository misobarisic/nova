[package]
name = "addons"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Client for the Stremio addon protocol (manifest, catalog, meta, stream)"

[features]
# The blocking HTTP client (`reqwest`). Enabled on desktop; Android depends on
# this crate with `default-features = false` and uses its own rustls client,
# keeping only the URL builders + byte parsers below.
default = ["client"]
client = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
