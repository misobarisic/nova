[package]
name = "nova-media"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
update-check = []

[dependencies]
nova-cache = { workspace = true }
nova-image = { workspace = true }
nova-config = { path = "../config" }
nova-providers = { path = "../providers" }
slint = { workspace = true }
# Bounded public-directory artwork; the shared cache owns variant decoding.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# --- Desktop (non-Android) -------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
addons = { workspace = true, features = ["client"] }
reqwest = { version = "0.13.4", features = ["blocking"] }

# --- Android ---------------------------------------------------------------
# rustls stack (OpenSSL does not cross-compile); blocking reqwest only.
[target.'cfg(target_os = "android")'.dependencies]
addons = { workspace = true, default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1"
zip = { version = "2", default-features = false }
