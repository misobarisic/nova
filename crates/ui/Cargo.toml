[package]
name = "nova-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# Retained feature name for development tooling. The compiled page bridges
# currently requires AOT handles; build.rs warns and stays compiled even when
# this feature is requested. A dynamic-global bridge is needed for hot reload.
live-preview = ["slint/live-preview"]

[dependencies]
nova-ui-base = { workspace = true }
serde_json = "1.0.151"
slint = { workspace = true }
# Slint's font registration exposes a family but does not add it to fallback.
i-slint-core = { workspace = true }
nova-config = { path = "../config" }
nova-ui-settings = { path = "../ui-settings" }
nova-ui-shared = { path = "../ui-shared" }
nova-ui-home = { path = "../ui-home" }
nova-ui-discover = { path = "../ui-discover" }
nova-ui-calendar = { path = "../ui-calendar" }
nova-ui-detail = { path = "../ui-detail" }
nova-ui-library = { path = "../ui-library" }
nova-ui-more = { path = "../ui-more" }
nova-ui-player-osd = { path = "../ui-player-osd" }
nova-ui-onboarding = { path = "../ui-onboarding" }

[build-dependencies]
slint-build = { workspace = true, features = ["experimental-module-builds"] }
