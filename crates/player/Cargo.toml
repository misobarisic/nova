[package]
name = "nova-player"
version = "0.1.0"
edition = "2024"
license.workspace = true

# In-window mpv player (desktop + Android). Split out of the app crate so the
# mpv/render/JNI surface doesn't recompile on app-logic edits. Never built on
# any other target.
[dependencies]
nova-config = { path = "../config" }
nova-ui = { path = "../ui" }
slint = { workspace = true }
# Source-built libmpv from the target Nix shell; build_libmpv stays off (see root Cargo.toml notes).
libmpv2 = "6.0.0"
# Node arrays preserve arbitrary HTTP header values when opening streams.
libmpv2-sys = "4.0.1"
# mpv track-list JSON parsing.
serde_json = "1.0.151"
# Screenshot encoding stays on its worker; share the artwork pipeline's codecs.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18"
webp = "=0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Isolate mpv from the state of Slint's shared OpenGL context.
glow = "0.17"
# Desktop SMTC attaches to Nova's HWND; COM stays on its dedicated worker.
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
# Exercise the shared-context guard with a real headless OpenGL context.
glow = "0.17"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libloading = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
# GL state guard around mpv's render callback (same version Slint uses).
glow = "0.17"
# JNI for the external-player fallback.
jni = "0.22"
# dlopen/dlsym for the Android EGL function-pointer lookup.
libc = "0.2"

[target.'cfg(all(target_os = "android", target_pointer_width = "32"))'.dependencies]
# Upstream's pregenerated bindings contain 64-bit size/offset assertions.
# Generate against the NDK target headers for the ARMv7 ABI instead.
libmpv2-sys = { version = "4.0.1", features = ["use-bindgen"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Idle inhibition (ScreenSaver, logind fallback) and MPRIS over D-Bus. Same major
# version the tree already pulls in transitively via atspi. The blocking
# API needs a runtime even when this crate is built/tested standalone.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
