[package]
name = "nova-download"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.4" }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
