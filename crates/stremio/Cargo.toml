[package]
name = "nova-stremio"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Bounded official Stremio API and lossless two-way library reconciliation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
url = "2"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
flate2 = "1"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
