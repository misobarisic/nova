[package]
name = "nova-tracking"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Account-scoped anime tracking mappings and progress projection"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nova-storage = { path = "../storage" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json", "form"] }
url = "2"
getrandom = "0.3.4"
zeroize = "1"
