name: Nova CI

on:
  workflow_call:
    inputs:
      commit:
        description: Validated release commit supplied by release-on-main
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate-release.py"
      - ".github/scripts/package-version.sh"
      - ".github/scripts/test_package_release.py"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate-release.py"
      - ".github/scripts/package-version.sh"
      - ".github/scripts/test_package_release.py"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read

env:
  NOVA_RELEASE_PROFILE: cd-release
  CARGO_INCREMENTAL: "0"

# Cancel stale pull-request and main-branch runs when newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.commit && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.commit == '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}

jobs:
  check-linux:
    name: Linux formatting, Clippy, and workspace check
    if: inputs.commit != '' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop .#default --command {0}
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: nix develop .#default --command cargo fmt --all -- --check

      - name: Test release packaging
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_package_*.py'
          python3 -B android/test_tv_packaging.py

      - name: Test release identity selection
        run: |
          nix develop .#default --command rustc --edition=2024 --test build-support/release_tag.rs -o "$RUNNER_TEMP/nova-release-tag-tests"
          "$RUNNER_TEMP/nova-release-tag-tests"

      - name: Run Clippy
        run: nix develop .#default --command cargo clippy --workspace --locked -- -D warnings

      - name: Check Rust workspace
        run: nix develop .#default --command cargo check --workspace --locked

      - name: Check distro build without update checks
        run: nix develop .#default --command cargo check --locked -p nova --no-default-features --features desktop

      - name: Test shared OpenGL state guard
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          nix develop .#default --command sh -eu <<'SH'
            test -f "$NOVA_TEST_EGL_VENDOR_LIBRARY_FILENAMES"
            export __EGL_VENDOR_LIBRARY_FILENAMES="$NOVA_TEST_EGL_VENDOR_LIBRARY_FILENAMES"
            exec cargo test -p nova-player --lib --features slint/renderer-femtovg clean_draw_and_host_state_round_trip --locked
          SH

  check-windows:
    name: Windows GNU target check
    if: inputs.commit != '' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          cmd-format: nix develop .#windows --command {0}
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Windows GNU target
        run: >-
          nix develop .#windows --command cargo check --workspace --locked
          --target x86_64-pc-windows-gnu

  check-android:
    name: Android ARM64 target check
    if: inputs.commit != '' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Free unused Android SDK space
        # The job uses the Nix SDK/NDK, not the runner's preinstalled SDK.
        run: sudo rm -rf /usr/local/lib/android

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-ci-v1
          key: nix-${{ hashFiles('flake.lock') }}
          # Keep shellHook diagnostics out of rust-cache's cargo metadata JSON.
          cmd-format: >-
            sh -c "nix develop .#android --command sh -c '{0} >&3' 3>&1 1>&2"
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test read-only Android runtime packaging
        run: nix develop .#android --command python3 -B android/test_runtime_packaging.py

      - name: Check Android ARM64 target
        run: >-
          nix develop .#android --command cargo check --locked
          --target aarch64-linux-android --no-default-features --features android,update-check
          --lib -p nova
