name: Nova CI

on:
  pull_request:
    paths:
      - ".github/workflows/build-release.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "flake.nix"
      - "flake.lock"
  push:
    tags:
      - "**"

permissions:
  contents: read

# Cancel stale pull-request runs when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-linux:
    name: Linux workspace check on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Check Rust workspace
        run: nix develop .#default --command cargo check --workspace --locked

  check-windows:
    name: Windows GNU target check on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Check Windows GNU target
        run: >-
          nix develop .#windows --command cargo check --workspace --locked
          --target x86_64-pc-windows-gnu

  android-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build universal APK (arm64-v8a + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Build both ABIs into universal APK
        run: >-
          nix develop .#android --command cargo apk2 build
          --no-default-features --lib -p nova --release

      - name: Stage universal release asset
        shell: bash
        run: |
          mapfile -t apks < <(find target -type f -name 'nova.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one aligned universal nova.apk, found %s:\n' "${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          tag="${GITHUB_REF_NAME//\//-}"
          cp "${apks[0]}" "dist/nova-${tag}.apk"
      - name: Verify universal APK contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apks = list(Path("dist").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one universal APK, found {len(apks)}")

          required = {
              f"lib/{abi}/{library}"
              for abi in ("arm64-v8a", "x86_64")
              for library in ("libnova.so", "libmpv.so")
          }
          with ZipFile(apks[0]) as apk:
              missing = sorted(required - set(apk.namelist()))
          if missing:
              raise SystemExit("Universal APK is missing: " + ", ".join(missing))
          print(f"Verified both ABIs and libmpv in {apks[0]}")
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  windows-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Build Windows executable
        run: >-
          nix develop .#windows --command cargo build --locked --release
          --target x86_64-pc-windows-gnu --bin nova

      - name: Stage Windows release bundle
        run: nix develop .#windows --command bash .github/scripts/package-windows.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [android-build, windows-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-android-apk
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-windows-x86_64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Nova ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
