            printf 'netrc-file = %s/nix-cache.netrc\n' "$RUNNER_TEMP"
          } | sudo tee -a /etc/nix/nix.conf > /dev/null
          sudo systemctl restart nix-daemon

      - name: Generate Cargo.nix with pinned nixpkgs crate2nix
        run: |
          nixpkgs_rev=$(python3 -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
          /usr/bin/time -f 'crate2nix-generate-seconds=%e' -o "$RUNNER_TEMP/crate2nix-generate.time" \
            nix run "github:NixOS/nixpkgs/$nixpkgs_rev#crate2nix" -- generate -o nix/Cargo.nix

      - name: Build the Nova workspace with crate2nix
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/crate2nix-build.log"
