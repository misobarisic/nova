    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Build both ABIs into universal APK
        run: >-
          nix develop .#android --command cargo apk2 build
          --no-default-features --lib -p nova --release

      - name: Stage universal release asset
        shell: bash
        run: |
          mapfile -t apks < <(find target -type f -name 'nova.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one aligned universal nova.apk, found %s:\n' "${#apks[@]}" >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          tag="${GITHUB_REF_NAME//\//-}"
          cp "${apks[0]}" "dist/nova-${tag}.apk"
      - name: Verify universal APK contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apks = list(Path("dist").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected one universal APK, found {len(apks)}")

          required = {
              f"lib/{abi}/{library}"
              for abi in ("arm64-v8a", "x86_64")
              for library in ("libnova.so", "libmpv.so")
          }
          with ZipFile(apks[0]) as apk:
              missing = sorted(required - set(apk.namelist()))
          if missing:
              raise SystemExit("Universal APK is missing: " + ", ".join(missing))
          print(f"Verified both ABIs and libmpv in {apks[0]}")
          PY
