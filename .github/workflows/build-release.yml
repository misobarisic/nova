            nix build --impure --no-link --print-out-paths --print-build-logs \
              --file nix/crate2nix-build.nix workspace 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          derivations_built=$(grep -cE "^building '/nix/store/.+\.drv'" "$log" || true)
          generate_time=$(cat "$RUNNER_TEMP/crate2nix-generate.time")
          build_time=$(cat "$RUNNER_TEMP/crate2nix-build.time")
          derivation_copies=$(grep -cE '^copying path ' "$log" || true)
          grep -E '^/nix/store/[a-z0-9]{32}-' "$log" | sort -u > "$RUNNER_TEMP/crate2nix-output-paths" || true
          {
            echo "## Crate2nix build benchmark"
            echo "- $generate_time"
            echo "- $build_time"
            echo "- Nix derivation build log lines: $derivations_built"
            echo "- Store paths copied from substituters: $derivation_copies"
            echo "- This builds every crate2nix workspace member; PR builds share the PR-only cache, separate from main."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish this PR's crate2nix outputs to its signed cache
        if: steps.cache-pr.outputs.configured == 'true'
        env:
          HETZNER_STORAGEBOX_HOST: ${{ secrets.HETZNER_STORAGEBOX_HOST }}
          HETZNER_STORAGEBOX_USER: ${{ secrets.HETZNER_STORAGEBOX_USER }}
          HETZNER_STORAGEBOX_PASSWORD: ${{ secrets.HETZNER_STORAGEBOX_PASSWORD }}
          NIX_CACHE_PR_SIGNING_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PR_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$NIX_CACHE_PR_SIGNING_PRIVATE_KEY" =~ ^[A-Za-z0-9._-]+:[A-Za-z0-9+/=]+$ ]]
          [[ "$HETZNER_STORAGEBOX_PASSWORD" != *$'\n'* ]]

          mapfile -t out_paths < "$RUNNER_TEMP/crate2nix-output-paths"
