            --include='/*.narinfo' --include='/nix-cache-info' --exclude='*' \
            -e "ssh $ssh_options" "$RUNNER_TEMP/nix-cache/" "$target:$remote_cache/"

          umask 077
          printf 'machine %s login %s password %s\n' \
            "$HETZNER_STORAGEBOX_HOST" "$HETZNER_STORAGEBOX_USER" "$HETZNER_STORAGEBOX_PASSWORD" \
            > "$RUNNER_TEMP/nix-cache.netrc"
          curl --fail --silent --show-error --netrc-file "$RUNNER_TEMP/nix-cache.netrc" \
            "https://$HETZNER_STORAGEBOX_HOST/nix-cache-pr/nix-cache-info" > /dev/null

      - name: Remove temporary cache credentials
