name: Nova CI

on:
  pull_request:
    paths:
      - ".github/workflows/build-release.yml"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/build-release.yml"
      - ".rustfmt.toml"
      - "rustfmt.toml"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".github/scripts/package-android.py"
      - ".github/scripts/test_package_android.py"
      - ".github/scripts/test_package_windows.py"
      - ".github/scripts/package-linux.sh"
      - ".github/scripts/package-windows.sh"
      - ".github/scripts/nova.desktop"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "build.rs"
      - "build-support/**"
      - "crates/**"
      - "src/**"
      - "android/**"
      - "vendor/**"
      - "assets/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
    tags:
      - "**"

permissions:
  contents: read

env:
  NOVA_RELEASE_PROFILE: cd-release

# Cancel stale pull-request and main-branch runs when newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  check-linux:
    name: Linux formatting, Clippy, and workspace check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Check Rust formatting
        run: nix develop .#default --command cargo fmt --all -- --check

      - name: Test release packaging
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_package_*.py'
          python3 -B android/test_tv_packaging.py

      - name: Run Clippy
        run: nix develop .#default --command cargo clippy --workspace --locked -- -D warnings

      - name: Check Rust workspace
        run: nix develop .#default --command cargo check --workspace --locked

      - name: Check distro build without update checks
        run: nix develop .#default --command cargo check --locked -p nova --no-default-features --features desktop

      - name: Test shared OpenGL state guard
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          nix develop .#default --command sh -eu <<'SH'
            test -f "$NOVA_TEST_EGL_VENDOR_LIBRARY_FILENAMES"
            export __EGL_VENDOR_LIBRARY_FILENAMES="$NOVA_TEST_EGL_VENDOR_LIBRARY_FILENAMES"
            exec cargo test -p nova-player --lib --features slint/renderer-femtovg clean_draw_and_host_state_round_trip --locked
          SH

  check-windows:
    name: Windows GNU target check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Check Windows GNU target
        run: >-
          nix develop .#windows --command cargo check --workspace --locked
          --target x86_64-pc-windows-gnu

  check-android:
    name: Android ARM64 target check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free unused Android SDK space
        # The job uses the Nix SDK/NDK, not the runner's preinstalled SDK.
        run: sudo rm -rf /usr/local/lib/android

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Test read-only Android runtime packaging
        run: nix develop .#android --command python3 -B android/test_runtime_packaging.py

      - name: Check Android ARM64 target
        run: >-
          nix develop .#android --command cargo check --locked
          --target aarch64-linux-android --no-default-features --features android,update-check
          --lib -p nova

  android-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Android ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Build release APK for this ABI
        env:
          ANDROID_TARGET: ${{ matrix.target }}
        run: >-
          nix develop .#android --command make android-build-release
          ANDROID_TARGET="$ANDROID_TARGET" RELEASE_PROFILE="$NOVA_RELEASE_PROFILE"

      - name: Upload ABI build input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-android-input-${{ matrix.abi }}
          path: target/${{ env.NOVA_RELEASE_PROFILE }}/apk/nova.apk
          if-no-files-found: error
          retention-days: 1

  android-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Assemble Android APKs (three ABIs and compressed universal)
    needs: [android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Download all ABI inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nova-android-input-*
          path: android-inputs
          merge-multiple: false

      - name: Merge, align, sign, and verify all APKs
        run: >-
          nix develop .#android --command python3 .github/scripts/package-android.py
          --abi-apk arm64-v8a=android-inputs/nova-android-input-arm64-v8a/nova.apk
          --abi-apk armeabi-v7a=android-inputs/nova-android-input-armeabi-v7a/nova.apk
          --abi-apk x86_64=android-inputs/nova-android-input-x86_64/nova.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-android-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  linux-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Linux x86_64 packages (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake curl desktop-file-utils dpkg-dev imagemagick \
            libasound2-dev libclang-dev libegl-dev libfontconfig1-dev \
            libfreetype6-dev libfuse2 libgbm-dev libinput-dev libmpv-dev \
            libseat-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            patchelf pkg-config \
            squashfs-tools xinput

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.1 --features cli

      - name: Build Nova release binary
        run: cargo build --locked --profile "$NOVA_RELEASE_PROFILE" --bin nova

      - name: Package Debian and AppImage artifacts
        run: bash .github/scripts/package-linux.sh

      - name: Upload Linux artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Build Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Build Windows executable
        run: >-
          nix develop .#windows --command cargo build --locked --profile "$NOVA_RELEASE_PROFILE"
          --target x86_64-pc-windows-gnu --bin nova

      - name: Stage Windows release bundle
        run: nix develop .#windows --command bash .github/scripts/package-windows.sh

      - name: Upload Windows artifact
        id: upload-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*.zip
          # The bundle is already zipped; upload it without a second ZIP layer.
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [android-package, linux-build, windows-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-android-apks
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-build.outputs.artifact-id }}
          path: dist
          # Preserve the release ZIP instead of extracting its executable/DLLs.
          skip-decompress: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Nova ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
