name: Nova release on main
run-name: Release ${{ inputs.tag }} (${{ inputs.publish && 'publish' || 'dry run' }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag (v followed by Cargo.toml version)
        required: true
        type: string
      commit:
        description: Full lowercase SHA of the tagged commit reachable from main
        required: true
        type: string
      publish:
        description: Publish GitHub release (false builds and verifies artifacts only)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  NOVA_RELEASE_PROFILE: cd-release
  CARGO_INCREMENTAL: "0"
  NOVA_RELEASE_TAG: ${{ inputs.tag }}
  NOVA_RELEASE_COMMIT: ${{ inputs.commit }}

# Different tags run independently; a duplicate never cancels a running release.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate main scope and immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      tag_object: ${{ steps.source.outputs.tag_object }}
    steps:
      - name: Require main workflow context
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main

      - name: Checkout trusted validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release inputs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--unpublished); fi
          python3 .github/scripts/validate-release.py "${args[@]}"

  android-build:
    needs: [validate]
    env:
      NOVA_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      NOVA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    name: Build Android ${{ matrix.abi }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - abi: arm64-v8a
            cache: release-android-aarch64
            target: aarch64-linux-android
          - abi: armeabi-v7a
            cache: release-android-armv7
            target: armv7-linux-androideabi
          - abi: x86_64
            cache: release-android-x86_64
            target: x86_64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      # The validator comes from the main workflow commit, never from an input tag.
      - name: Checkout release validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: .github/scripts/validate-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache release Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-release-v1
          shared-key: ${{ matrix.cache }}-${{ matrix.target }}-cd-release-nix-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          # Preserve machine-readable output while the Android hook logs to stderr.
          cmd-format: >-
            sh -c "nix develop .#android --command sh -c '{0} >&3' 3>&1 1>&2"
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}

      - name: Build release APK for this ABI
        env:
          ANDROID_TARGET: ${{ matrix.target }}
        run: >-
          nix develop .#android --command make android-build-release
          ANDROID_TARGET="$ANDROID_TARGET" RELEASE_PROFILE="$NOVA_RELEASE_PROFILE"

      - name: Recheck release tag after build
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Upload ABI build input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-android-input-${{ matrix.abi }}
          path: target/${{ env.NOVA_RELEASE_PROFILE }}/apk/nova.apk
          if-no-files-found: error
          retention-days: 1

  android-package:
    needs: [validate, android-build]
    env:
      NOVA_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      NOVA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    name: Assemble Android APKs (three ABIs and compressed universal)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      # The validator comes from the main workflow commit, never from an input tag.
      - name: Checkout release validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: .github/scripts/validate-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Download all ABI inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nova-android-input-*
          path: android-inputs
          merge-multiple: false

      - name: Merge, align, sign, and verify all APKs
        run: >-
          nix develop .#android --command python3 .github/scripts/package-android.py
          --abi-apk arm64-v8a=android-inputs/nova-android-input-arm64-v8a/nova.apk
          --abi-apk armeabi-v7a=android-inputs/nova-android-input-armeabi-v7a/nova.apk
          --abi-apk x86_64=android-inputs/nova-android-input-x86_64/nova.apk

      - name: Recheck release tag after build
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-android-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  linux-build:
    needs: [validate]
    env:
      NOVA_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      NOVA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    name: Build Linux x86_64 packages (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      # The validator comes from the main workflow commit, never from an input tag.
      - name: Checkout release validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: .github/scripts/validate-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Cache release Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-release-v1
          shared-key: release-linux-ubuntu22-x86_64-unknown-linux-gnu-cd-release
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake curl desktop-file-utils dpkg-dev imagemagick \
            libasound2-dev libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev libegl-dev libfontconfig1-dev \
            libfreetype6-dev libfuse2 libgbm-dev libinput-dev libmpv-dev \
            libseat-dev libssl-dev libudev-dev libvulkan-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            patchelf pkg-config \
            squashfs-tools xinput

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.1 --features cli

      - name: Build Nova release binary
        run: cargo build --timings --locked --profile "$NOVA_RELEASE_PROFILE" --bin nova

      - name: Package Debian and AppImage artifacts
        run: bash .github/scripts/package-linux.sh

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-release-timings-linux-build
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Recheck release tag after build
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-linux-x86_64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-build:
    needs: [validate]
    env:
      NOVA_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      NOVA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    name: Build Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      # The validator comes from the main workflow commit, never from an input tag.
      - name: Checkout release validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: .github/scripts/validate-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Cache release Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: nova-release-v1
          shared-key: release-windows-gnu-x86_64-pc-windows-gnu-cd-release-nix-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**') }}
          cmd-format: nix develop .#windows --command {0}
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}

      - name: Build Windows executable
        run: >-
          nix develop .#windows --command cargo build --timings --locked --profile "$NOVA_RELEASE_PROFILE"
          --target x86_64-pc-windows-gnu --bin nova

      - name: Stage Windows release bundle
        run: nix develop .#windows --command bash .github/scripts/package-windows.sh

      - name: Upload Cargo build timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nova-release-timings-windows-build
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Recheck release tag after build
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Upload Windows artifact
        id: upload-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*.zip
          # The bundle is already zipped; upload it without a second ZIP layer.
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [validate, android-package, linux-build, windows-build]
    env:
      NOVA_RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      NOVA_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    name: Publish tag release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: inputs.publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0

      # The validator comes from the main workflow commit, never from an input tag.
      - name: Checkout release validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: .github/scripts/validate-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify release source
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head

      - name: Download APK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-android-apks
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-build.outputs.artifact-id }}
          path: dist
          # Preserve the release ZIP instead of extracting its executable/DLLs.
          skip-decompress: true

      - name: Verify release inputs immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-control/.github/scripts/validate-release.py --recheck --check-head --unpublished

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          name: Nova ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
