<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512">
  <!-- Rasterized ramps keep artwork readable without visible gradient bands. -->
  <defs>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1221" stop-opacity="0.06"/>
      <stop offset="0.3" stop-color="#0b1221" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#0b1221" stop-opacity="0.8"/>
      <stop offset="0.85" stop-color="#0b1221" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#0b1221" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1221" stop-opacity="0.4"/>
      <stop offset="0.65" stop-color="#0b1221" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bottom)"/>
  <rect width="100%" height="100%" fill="url(#left)"/>
</svg>
