<svg xmlns="http://www.w3.org/2000/svg" width="128" height="1024" viewBox="0 0 128 1024">
  <!-- Rasterized alpha ramps stay continuous on both Android and desktop. -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080d17" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#080d17" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#080d17" stop-opacity="0.42"/>
      <stop offset="0.70" stop-color="#080d17" stop-opacity="0.84"/>
      <stop offset="0.92" stop-color="#080d17" stop-opacity="1"/>
      <stop offset="1" stop-color="#080d17" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="caption" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080d17" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#080d17" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#080d17" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="1024" fill="url(#caption)"/>
  <rect width="128" height="1024" fill="url(#shade)"/>
</svg>
