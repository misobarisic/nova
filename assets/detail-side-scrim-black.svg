<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <!-- Match the bottom mask's square raster for stable sampling. -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.94"/>
      <stop offset="0.4" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#shade)"/>
</svg>
