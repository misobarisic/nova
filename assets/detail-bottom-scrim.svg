<svg xmlns="http://www.w3.org/2000/svg" width="2" height="1024">
  <!-- Rasterized alpha ramp keeps the fade continuous on all renderers. -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080f19" stop-opacity="0.06"/>
      <stop offset="0.3" stop-color="#080f19" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#080f19" stop-opacity="0.7"/>
      <stop offset="0.8" stop-color="#080f19" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#080f19" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#shade)"/>
</svg>
